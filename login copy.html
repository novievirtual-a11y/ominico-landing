<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ominico Login — Coming Soon</title>
  <link rel="icon" href="ominico favicon.png">

  <style>
    :root{
      --blue:#006ff5;
      --cyan:#10c8ef;
      --navy:#102a5c;
      --text:#17213d;
      --muted:#667085;
      --white:#ffffff;
      --soft:#f6fbff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 20%,rgba(0,111,245,.22),transparent 28%),
        radial-gradient(circle at 80% 18%,rgba(16,200,239,.26),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(0,111,245,.16),transparent 34%),
        linear-gradient(135deg,#ffffff,#f3fbff);
      overflow:hidden;
    }

    body:before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(0,111,245,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,111,245,.045) 1px,transparent 1px);
      background-size:58px 58px;
      mask-image:linear-gradient(to bottom,black,transparent 90%);
    }

    .orb{
      position:absolute;
      width:280px;
      height:280px;
      border-radius:50%;
      filter:blur(8px);
      opacity:.45;
      animation:float 7s ease-in-out infinite;
    }

    .orb.one{
      left:-80px;
      top:90px;
      background:var(--blue);
    }

    .orb.two{
      right:-90px;
      bottom:90px;
      background:var(--cyan);
      animation-delay:-3s;
    }

    .login-card{
      position:relative;
      z-index:2;
      width:min(100% - 32px,460px);
      padding:42px;
      border-radius:34px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.75);
      box-shadow:0 30px 90px rgba(0,111,245,.18);
      backdrop-filter:blur(22px);
      text-align:center;
      animation:show .7s ease both;
    }

    .logo{
      height:46px;
      width:auto;
      margin:0 auto 28px;
      display:block;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:9px 14px;
      border-radius:999px;
      background:rgba(0,111,245,.08);
      color:var(--blue);
      font-size:.86rem;
      font-weight:850;
      margin-bottom:22px;
    }

    .badge:before{
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--cyan);
      box-shadow:0 0 14px rgba(16,200,239,.85);
    }

    h1{
      margin:0 0 14px;
      color:var(--navy);
      font-size:2.4rem;
      line-height:1;
      letter-spacing:-.06em;
    }

    p{
      margin:0 auto 28px;
      max-width:350px;
      color:var(--muted);
      line-height:1.7;
    }

    .form{
      display:grid;
      gap:14px;
      margin-top:24px;
    }

    .input{
      width:100%;
      height:54px;
      border-radius:16px;
      border:1px solid #dce8f7;
      background:#fff;
      padding:0 16px;
      font:inherit;
      color:var(--text);
      outline:none;
      transition:.2s;
    }

    .input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(0,111,245,.10);
    }

    .btn{
      height:56px;
      border:0;
      border-radius:999px;
      color:#fff;
      font-weight:850;
      font-size:1rem;
      cursor:pointer;
      background:linear-gradient(135deg,var(--blue),var(--cyan));
      box-shadow:0 18px 40px rgba(0,111,245,.22);
      transition:.25s;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 24px 55px rgba(0,111,245,.28);
    }

    .back{
      display:inline-flex;
      margin-top:22px;
      color:var(--blue);
      font-weight:750;
    }

    .notice{
      display:none;
      margin-top:18px;
      padding:14px;
      border-radius:16px;
      background:rgba(16,200,239,.10);
      color:var(--navy);
      font-size:.92rem;
      line-height:1.5;
    }

    .notice.show{
      display:block;
      animation:show .4s ease both;
    }

    @keyframes show{
      from{opacity:0;transform:translateY(18px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-22px)}
    }

    @media(max-width:520px){
      .login-card{
        padding:32px 22px;
      }

      h1{
        font-size:2rem;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="login-card">
    <img class="logo" src="ominico logo 512.png" alt="Ominico">

    <div class="badge">Dashboard Preview</div>

    <h1>Login Coming Soon</h1>

    <p>
      The Ominico dashboard is currently being prepared.
      Early access will be available soon for selected businesses.
    </p>

    <form class="form" id="loginForm">
      <input class="input" type="email" placeholder="Business email" required>
      <input class="input" type="password" placeholder="Password" required>

      <button class="btn" type="submit">
        Request Early Access
      </button>
    </form>

    <div class="notice" id="notice">
      Thank you. Ominico dashboard access is not open yet. Please contact sales for early access.
    </div>

    <a class="back" href="index.html">← Back to homepage</a>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const notice = document.getElementById("notice");

    form.addEventListener("submit", function(event){
      event.preventDefault();
      notice.classList.add("show");
    });
  </script>
</body>
</html>
