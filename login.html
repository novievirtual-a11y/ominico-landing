<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ominico Dashboard Access</title>

  <link rel="icon" href="ominico favicon.png">

  <style>

    :root{
      --blue:#006ff5;
      --cyan:#14c8ff;
      --purple:#8f56ff;

      --bg:#020817;
      --bg-2:#030b25;

      --text:#ffffff;
      --muted:rgba(255,255,255,.68);

      --line:rgba(92,131,255,.16);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#030b25;

      color:#fff;
    }

    /* =========================================
       BACKGROUND IMAGE
    ========================================= */

    .bg{
      position:absolute;
      inset:0;

      background-image:url("hero.png");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      transform:scale(1.02);

      z-index:0;
    }

    /* =========================================
       OVERLAY
    ========================================= */

    .overlay{
      position:absolute;
      inset:0;

      background:
        linear-gradient(
          135deg,
          rgba(2,6,23,.88),
          rgba(2,6,23,.72)
        );

      z-index:1;
    }

    /* =========================================
       GRID
    ========================================= */

    .grid{
      position:absolute;
      inset:0;

      background-image:
        linear-gradient(
          rgba(0,111,245,.03) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(0,111,245,.03) 1px,
          transparent 1px
        );

      background-size:68px 68px;

      z-index:1;
    }

    /* =========================================
       GLOW
    ========================================= */

    .glow{
      position:absolute;

      border-radius:50%;

      filter:blur(80px);

      opacity:.26;

      z-index:1;

      animation:float 8s ease-in-out infinite;
    }

    .glow.one{
      width:340px;
      height:340px;

      top:-120px;
      right:-80px;

      background:#006ff5;
    }

    .glow.two{
      width:260px;
      height:260px;

      left:-80px;
      bottom:-80px;

      background:#8f56ff;

      animation-delay:-3s;
    }

    /* =========================================
       CARD
    ========================================= */

    .login-card{
      position:relative;
      z-index:2;

      width:min(100% - 32px,520px);

      padding:42px;

      border-radius:34px;

      border:1px solid rgba(84,133,255,.16);

      background:
        linear-gradient(
          180deg,
          rgba(10,18,40,.92),
          rgba(8,14,30,.82)
        );

      backdrop-filter:blur(20px);

      box-shadow:
        0 30px 80px rgba(0,111,245,.18);

      animation:show .7s ease both;
    }

    /* =========================================
       LOGO
    ========================================= */

    .logo{
      height:44px;
      width:auto;

      margin:0 auto 28px;
    }

    /* =========================================
       BADGE
    ========================================= */

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;

      padding:10px 16px;

      border-radius:999px;

      border:1px solid rgba(84,133,255,.20);

      background:
        linear-gradient(
          135deg,
          rgba(0,111,245,.12),
          rgba(143,86,255,.08)
        );

      color:#fff;

      font-size:.76rem;
      font-weight:700;

      letter-spacing:.12em;

      margin-bottom:24px;
    }

    .badge::before{
      content:"";

      width:8px;
      height:8px;

      border-radius:50%;

      background:#14c8ff;

      box-shadow:
        0 0 12px #14c8ff;
    }

    /* =========================================
       CONTENT
    ========================================= */

    .content{
      text-align:center;
    }

    h1{
      margin-bottom:14px;

      font-size:clamp(2.4rem,5vw,3.4rem);

      line-height:1;

      letter-spacing:-.07em;

      font-weight:820;
    }

    h1 span{
      background:
        linear-gradient(
          135deg,
          #14c8ff 0%,
          #4b7fff 42%,
          #9d5bff 100%
        );

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;
    }

    p{
      color:var(--muted);

      line-height:1.8;

      font-size:1rem;

      margin-bottom:32px;
    }

    /* =========================================
       FORM
    ========================================= */

    .form{
      display:grid;
      gap:14px;
    }

    .input{
      width:100%;
      height:58px;

      border-radius:18px;

      border:1px solid rgba(84,133,255,.14);

      background:
        rgba(10,18,40,.72);

      color:#fff;

      padding:0 18px;

      font:inherit;

      outline:none;

      transition:.2s ease;
    }

    .input::placeholder{
      color:rgba(255,255,255,.36);
    }

    .input:focus{
      border-color:#4d7fff;

      box-shadow:
        0 0 0 4px rgba(0,111,245,.12);
    }

    .btn{
      height:58px;

      border:none;

      border-radius:18px;

      font-size:1rem;
      font-weight:750;

      color:#fff;

      cursor:pointer;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 20px 50px rgba(0,111,245,.22);

      transition:.25s ease;
    }

    .btn:hover{
      transform:translateY(-3px);

      box-shadow:
        0 28px 70px rgba(0,111,245,.34);
    }

    /* =========================================
       NOTICE
    ========================================= */

    .notice{
      display:none;

      margin-top:18px;

      padding:16px;

      border-radius:18px;

      border:1px solid rgba(84,133,255,.14);

      background:
        rgba(10,18,40,.72);

      color:rgba(255,255,255,.78);

      font-size:.94rem;

      line-height:1.7;
    }

    .notice.show{
      display:block;

      animation:show .5s ease both;
    }

    /* =========================================
       BACK
    ========================================= */

    .back{
      display:inline-flex;

      margin-top:26px;

      color:#7eb6ff;

      font-size:.94rem;
      font-weight:600;

      transition:.2s ease;
    }

    .back:hover{
      color:#fff;
    }

    /* =========================================
       ANIMATION
    ========================================= */

    @keyframes show{
      from{
        opacity:0;
        transform:translateY(18px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-20px);
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media(max-width:640px){

      .login-card{
        padding:34px 24px;
      }

      h1{
        font-size:2.4rem;
      }
    }

  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="grid"></div>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="login-card">

    <div class="content">

      <img class="logo" src="ominico logo 512 dark.png" alt="Ominico">

      <h1>
        Dashboard Access<br>
        <span>Coming Soon</span>
      </h1>

      <p>
        Ominico dashboard is currently under development.
        Join the early access waiting list to get notified when access becomes available.
      </p>

<form class="form" id="waitlistForm">

  <input
    class="input"
    id="emailInput"
    type="email"
    placeholder="Business email address"
    required
  >

  <button class="btn" type="submit">
    Join Waiting List
  </button>

</form>

<div class="notice" id="notice"></div>

      <a class="back" href="index.html">
        ← Back to Homepage
      </a>

    </div>

  </main>

<script>

  const form = document.getElementById("waitlistForm");
  const emailInput = document.getElementById("emailInput");
  const notice = document.getElementById("notice");

  form.addEventListener("submit", function(event){

    event.preventDefault();

    const email =
      emailInput.value.trim();

    /*
      STRICT EMAIL VALIDATION
      Reject:
      - iman@smartme
      - iman@smartme.co

      Allow:
      - iman@gmail.com
      - iman@company.ai
      - iman@smartme.co.id
    */

    const emailPattern =
      /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+){2,}$/;

    if(!emailPattern.test(email)){

      notice.classList.add("show");

      notice.style.borderColor =
        "rgba(255,80,80,.22)";

      notice.style.color =
        "#ffb4b4";

      notice.innerHTML =
        "Please enter a valid business email address.";

      return;
    }

    /*
      SUCCESS
    */

    notice.classList.add("show");

    notice.style.borderColor =
      "rgba(84,133,255,.16)";

    notice.style.color =
      "rgba(255,255,255,.78)";

    notice.innerHTML = `
      Thank you for joining the Ominico early access waiting list.
      Our team will notify you once dashboard access becomes available.
    `;

    emailInput.value = "";

  });

</script>

</body>
</html>
